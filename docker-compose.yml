services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulseboard
      POSTGRES_PASSWORD: pulseboard
      POSTGRES_DB: pulseboard
    ports:
      - "5432:5432"
    volumes:
      - pulseboard-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseboard -d pulseboard"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://pulseboard:pulseboard@postgres:5432/pulseboard?schema=public
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:4000
      JWT_ACCESS_SECRET: local-docker-access-secret-change-me
      JWT_REFRESH_SECRET: local-docker-refresh-secret-change-me
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma db push && node server/dist/index.js"
volumes:
  pulseboard-data:
